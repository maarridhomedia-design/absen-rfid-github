 <body class="w-full min-h-full bg-gradient-to-br from-blue-50 to-indigo-100">

    const GOOGLE_SHEETS_REKAP_URL = 'https://script.google.com/macros/s/AKfycbzZr9oFkuAhbrGQX6Ba1zJYRb7ks7-JJcxrfdi65AuqJAzmayV_Gpjw4pH248veIQ6w/exec';
    
    const STUDENTS_DATA = [
      { rfid: '0001134892', nama: 'Farhan Ramadhani', kelas: '10' },
      { rfid: '0002290336', nama: 'Hatikurrahman', kelas: '10' },
      { rfid: '0001696971', nama: 'Syaiful Bahri', kelas: '10' },
      { rfid: '0001200735', nama: 'Febriansyah', kelas: '11' },
      { rfid: '0002245415', nama: 'Mahmud', kelas: '11' },
      { rfid: '0001699259', nama: 'Aril Maulana', kelas: '12' },
      { rfid: '0006063666', nama: 'Moh Rifqi', kelas: '12' },
      { rfid: '0001157118', nama: 'Zainal Efendi', kelas: '12' },
      { rfid: '0001134658', nama: 'Ach Ready', kelas: '12' },
      { rfid: '0001742383', nama: 'Muhammad Nashrulloh', kelas: '12' },
      { rfid: '0001190469', nama: 'Syaiful Rizal', kelas: '12' },
      { rfid: '0001130224', nama: 'Ach Wanente', kelas: '12' }

    const defaultConfig = {
      school_name: 'MA AR-RIDHO',
      scan_instruction: 'Tempelkan Kartu RFID Anda'

    let currentPage = 'login';
    let allRecords = [];
    let rfidInput = '';

    let filterKelas = 'all';
    let filterTanggal = '';

    function getCurrentDate() {
      const now = new Date();
      return now.toISOString().split('T')[0];
    }

    function getCurrentTime() {
      const now = new Date();
      return now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    function getJamPeriode() {
      const hour = new Date().getHours();
      if (hour >= 7 && hour < 9) return 'jam1';
      if (hour >= 9 && hour < 11) return 'jam2';
      if (hour >= 11 && hour < 13) return 'jam3';
      return 'jam1';
    }

    function showToast(message, type = 'success') {
      const toastContainer = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const bgColor = type === 'success' ? 'bg-green-500' : type === 'error' ? 'bg-red-500' : 'bg-blue-500';
      
      toast.className = `toast ${bgColor} text-white px-6 py-4 rounded-lg shadow-lg mb-2`;
      toast.textContent = message;
      
      toastContainer.appendChild(toast);
      
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    async function sendToGoogleSheets(records) {
      const promises = records.map((record, index) => {
        // Konversi jam ke format H/S/I
        const getStatus = (jam) => {
          if (!jam || jam === '') return '';
          if (jam === 'Sakit') return 'S';
          if (jam === 'Izin') return 'I';
          return 'H'; // Hadir (waktu atau "Hadir")
        };

        return fetch(GOOGLE_SHEETS_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            no: index + 1,
            rfid: record.rfid,
            nama: record.nama,
            kelas: record.kelas,
            jam1: getStatus(record.jam1),
            jam2: getStatus(record.jam2),
            jam3: getStatus(record.jam3)
          })
        });
      });

      await Promise.all(promises);
    }

    async function sendRekapToGoogleSheets(rekapData, month) {
      const promises = rekapData.map((data, index) => {
        return fetch(GOOGLE_SHEETS_REKAP_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            no: index + 1,
            rfid: data.rfid,
            nama: data.nama,
            kelas: data.kelas,
            bulan: month,
            jam1_hadir: data.jam1.hadir,
            jam1_sakit: data.jam1.sakit,
            jam1_izin: data.jam1.izin,
            jam2_hadir: data.jam2.hadir,
            jam2_sakit: data.jam2.sakit,
            jam2_izin: data.jam2.izin,
            jam3_hadir: data.jam3.hadir,
            jam3_sakit: data.jam3.sakit,
            jam3_izin: data.jam3.izin,
            total_hadir: data.total.hadir,
            total_sakit: data.total.sakit,
            total_izin: data.total.izin
          })
        });
      });

      await Promise.all(promises);
    }

                  </div>
                  <svg class="w-12 h-12 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>

            <div class="bg-red-50 border border-red-200 rounded-lg p-4">

                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>

    function renderAbsensi() {
      const config = window.elementSdk?.config || defaultConfig;
      const today = getCurrentDate();
      
      const filteredRecords = allRecords
        .filter(r => r.type === 'attendance')
        .filter(r => filterKelas === 'all' || r.kelas === filterKelas)
        .filter(r => !filterTanggal || r.tanggal === filterTanggal);

      const groupedByDate = {};
      filteredRecords.forEach(record => {
        if (!groupedByDate[record.tanggal]) {
          groupedByDate[record.tanggal] = {};
        }
        groupedByDate[record.tanggal][record.rfid] = record;
      });

      const displayStudents = filterKelas === 'all' 
        ? STUDENTS_DATA 
        : STUDENTS_DATA.filter(s => s.kelas === filterKelas);

      return `
        <div class="p-6 space-y-6">
          <div class="bg-white rounded-xl shadow-md p-6">
            <div class="flex justify-between items-center mb-6">
              <h2 class="text-2xl font-bold text-gray-800">Data Absensi</h2>
              <div class="flex gap-2">
                <button id="add-manual-btn" class="bg-yellow-500 hover:bg-yellow-600 text-white px-4 py-2 rounded-lg transition duration-200 flex items-center">
                  <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                  </svg>
                  Absensi Manual
                </button>
                <button id="sync-sheets-btn" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg transition duration-200 flex items-center">
                  <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                  </svg>
                  <span id="sync-sheets-text">Kirim ke Spreadsheet</span>
                </button>
                <button id="export-btn" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg transition duration-200 flex items-center">
                  <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                  </svg>
                  Export CSV
                </button>
              </div>
            </div>

            <div class="flex gap-4 mb-6">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2" for="filter-kelas">Filter Kelas</label>
                <select id="filter-kelas" class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                  <option value="all">Semua Kelas</option>
                  <option value="10">Kelas 10</option>
                  <option value="11">Kelas 11</option>
                  <option value="12">Kelas 12</option>
                </select>
              </div>
              
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2" for="filter-tanggal">Filter Tanggal</label>
                <input type="date" id="filter-tanggal" class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
              </div>
            </div>

            <div class="overflow-x-auto">
              <table class="w-full">
                <thead class="bg-indigo-600 text-white">
                  <tr>
                    <th class="px-4 py-3 text-left">No</th>
                    <th class="px-4 py-3 text-left">RFID</th>
                    <th class="px-4 py-3 text-left">Nama Siswa</th>
                    <th class="px-4 py-3 text-left">Kelas</th>
                    <th class="px-4 py-3 text-center">Jam 1</th>
                    <th class="px-4 py-3 text-center">Jam 2</th>
                    <th class="px-4 py-3 text-center">Jam 3</th>
                    <th class="px-4 py-3 text-left">Tanggal</th>
                    <th class="px-4 py-3 text-center">Aksi</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-gray-200">
                  ${displayStudents.map((student, index) => {
                    const recordKey = filterTanggal || today;
                    const record = groupedByDate[recordKey]?.[student.rfid];
                    
                    let jumlahHadir = 0;
                    if (record) {
                      if (record.jam1 && record.jam1 !== 'Sakit' && record.jam1 !== 'Izin') jumlahHadir++;
                      if (record.jam2 && record.jam2 !== 'Sakit' && record.jam2 !== 'Izin') jumlahHadir++;
                      if (record.jam3 && record.jam3 !== 'Sakit' && record.jam3 !== 'Izin') jumlahHadir++;
                    }
                    
                    return `
                      <tr class="hover:bg-gray-50">
                        <td class="px-4 py-3">${index + 1}</td>
                        <td class="px-4 py-3 font-mono text-sm">${student.rfid}</td>
                        <td class="px-4 py-3 font-medium">${student.nama}</td>
                        <td class="px-4 py-3">${student.kelas}</td>
                        <td class="px-4 py-3 text-center">
                          ${record?.jam1 ? `
                            <div class="flex flex-col items-center">
                              <span class="text-green-600 font-semibold text-xs">${record.jam1}</span>
                              ${record.jam1 !== 'Sakit' && record.jam1 !== 'Izin' ? '<span class="text-green-700 font-bold text-xs mt-1">✓ Hadir</span>' : ''}
                            </div>
                          ` : '<span class="text-gray-400">-</span>'}
                        </td>
                        <td class="px-4 py-3 text-center">
                          ${record?.jam2 ? `
                            <div class="flex flex-col items-center">
                              <span class="text-blue-600 font-semibold text-xs">${record.jam2}</span>

    function renderRekap() {
      const currentMonth = new Date().toISOString().slice(0, 7);
      const monthRecords = allRecords.filter(r => r.tanggal.startsWith(currentMonth) && r.type === 'attendance');

      const studentStats = STUDENTS_DATA.map(student => {
        const records = monthRecords.filter(r => r.rfid === student.rfid);
        
        let jam1Hadir = 0, jam1Sakit = 0, jam1Izin = 0;
        let jam2Hadir = 0, jam2Sakit = 0, jam2Izin = 0;
        let jam3Hadir = 0, jam3Sakit = 0, jam3Izin = 0;
        
        records.forEach(r => {
          if (r.jam1) {
            if (r.jam1 === 'Hadir' || (r.jam1 !== 'Sakit' && r.jam1 !== 'Izin')) {
              jam1Hadir++;
            } else if (r.jam1 === 'Sakit') {
              jam1Sakit++;
            } else if (r.jam1 === 'Izin') {
              jam1Izin++;
            }
          }
          
          if (r.jam2) {
            if (r.jam2 === 'Hadir' || (r.jam2 !== 'Sakit' && r.jam2 !== 'Izin')) {
              jam2Hadir++;
            } else if (r.jam2 === 'Sakit') {
              jam2Sakit++;
            } else if (r.jam2 === 'Izin') {
              jam2Izin++;
            }
          }
          
          if (r.jam3) {
            if (r.jam3 === 'Hadir' || (r.jam3 !== 'Sakit' && r.jam3 !== 'Izin')) {
              jam3Hadir++;
            } else if (r.jam3 === 'Sakit') {
              jam3Sakit++;
            } else if (r.jam3 === 'Izin') {
              jam3Izin++;
            }
          }
        });

        const totalHadir = jam1Hadir + jam2Hadir + jam3Hadir;
        const totalSakit = jam1Sakit + jam2Sakit + jam3Sakit;
        const totalIzin = jam1Izin + jam2Izin + jam3Izin;

        return { 
          ...student, 
          jam1: { hadir: jam1Hadir, sakit: jam1Sakit, izin: jam1Izin },
          jam2: { hadir: jam2Hadir, sakit: jam2Sakit, izin: jam2Izin },
          jam3: { hadir: jam3Hadir, sakit: jam3Sakit, izin: jam3Izin },
          total: { hadir: totalHadir, sakit: totalSakit, izin: totalIzin }
        };
      });

      return `
        <div class="p-6 space-y-6">
          <div class="bg-white rounded-xl shadow-md p-6">
            <div class="flex justify-between items-center mb-6">
              <h2 class="text-2xl font-bold text-gray-800">Rekap Absensi Bulanan</h2>
              <button id="sync-rekap-btn" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg transition duration-200 flex items-center">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                </svg>
                <span id="sync-rekap-text">Kirim ke Spreadsheet</span>
              </button>
            </div>
            
            <div class="mb-4">
              <label class="block text-sm font-medium text-gray-700 mb-2" for="rekap-bulan">Pilih Bulan</label>
              <input type="month" id="rekap-bulan" class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent" value="${currentMonth}">
            </div>

            <div class="overflow-x-auto">
              <table class="w-full text-sm">
                <thead class="bg-indigo-600 text-white">
                  <tr>
                    <th class="px-3 py-3 text-left" rowspan="2">No</th>
                    <th class="px-3 py-3 text-left" rowspan="2">RFID</th>
                    <th class="px-3 py-3 text-left" rowspan="2">Nama Siswa</th>
                    <th class="px-3 py-3 text-left" rowspan="2">Kelas</th>
                    <th class="px-3 py-3 text-center border-l border-white" colspan="3">Jam 1</th>
                    <th class="px-3 py-3 text-center border-l border-white" colspan="3">Jam 2</th>
                    <th class="px-3 py-3 text-center border-l border-white" colspan="3">Jam 3</th>
                  </tr>
                  <tr>
                    <th class="px-2 py-2 text-center border-l border-white text-xs">H</th>
                    <th class="px-2 py-2 text-center text-xs">S</th>
                    <th class="px-2 py-2 text-center text-xs">I</th>
                    <th class="px-2 py-2 text-center border-l border-white text-xs">H</th>
                    <th class="px-2 py-2 text-center text-xs">S</th>
                    <th class="px-2 py-2 text-center text-xs">I</th>
                    <th class="px-2 py-2 text-center border-l border-white text-xs">H</th>
                    <th class="px-2 py-2 text-center text-xs">S</th>
                    <th class="px-2 py-2 text-center text-xs">I</th>

                </thead>
                <tbody class="divide-y divide-gray-200">
                  ${studentStats.map((student, index) => `
                    <tr class="hover:bg-gray-50">
                      <td class="px-3 py-3">${index + 1}</td>

                      <td class="px-2 py-3 text-center border-l">
                        <span class="px-2 py-1 bg-green-100 text-green-800 rounded font-semibold text-xs">${student.jam1.hadir}</span>
                      </td>
                      <td class="px-2 py-3 text-center">
                        <span class="px-2 py-1 bg-yellow-100 text-yellow-800 rounded font-semibold text-xs">${student.jam1.sakit}</span>
                      </td>
                      <td class="px-2 py-3 text-center">
                        <span class="px-2 py-1 bg-blue-100 text-blue-800 rounded font-semibold text-xs">${student.jam1.izin}</span>
                      </td>
                      <td class="px-2 py-3 text-center border-l">
                        <span class="px-2 py-1 bg-green-100 text-green-800 rounded font-semibold text-xs">${student.jam2.hadir}</span>
                      </td>
                      <td class="px-2 py-3 text-center">
                        <span class="px-2 py-1 bg-yellow-100 text-yellow-800 rounded font-semibold text-xs">${student.jam2.sakit}</span>
                      </td>
                      <td class="px-2 py-3 text-center">
                        <span class="px-2 py-1 bg-blue-100 text-blue-800 rounded font-semibold text-xs">${student.jam2.izin}</span>
                      </td>
                      <td class="px-2 py-3 text-center border-l">
                        <span class="px-2 py-1 bg-green-100 text-green-800 rounded font-semibold text-xs">${student.jam3.hadir}</span>
                      </td>
                      <td class="px-2 py-3 text-center">
                        <span class="px-2 py-1 bg-yellow-100 text-yellow-800 rounded font-semibold text-xs">${student.jam3.sakit}</span>
                      </td>
                      <td class="px-2 py-3 text-center">
                        <span class="px-2 py-1 bg-blue-100 text-blue-800 rounded font-semibold text-xs">${student.jam3.izin}</span>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function renderContent() {
      const content = document.getElementById('content');
      
      switch(currentPage) {
        case 'dashboard':
          content.innerHTML = renderDashboard();
          break;
        case 'scan':
          content.innerHTML = renderScan();
          attachScanListeners();
          startClock();
          updateRecentScans();
          break;
        case 'absensi':
          content.innerHTML = renderAbsensi();
          attachAbsensiListeners();
          break;
        case 'rekap':
          content.innerHTML = renderRekap();
          attachRekapListeners();
          break;
        case 'siswa':
          content.innerHTML = renderSiswa();
          attachSiswaListeners();
          break;
      }
    }

    function attachLoginListeners() {
      const loginBtn = document.getElementById('login-btn');
      const usernameInput = document.getElementById('username-input');
      const passwordInput = document.getElementById('password-input');

      const handleLogin = () => {
        const username = usernameInput.value.trim();
        const password = passwordInput.value.trim();

        if (username === 'admin' && password === 'admin') {
          currentUser = { username };
          currentPage = 'dashboard';
          render();
          showToast('Login berhasil! Selamat datang.', 'success');
        } else {
          showToast('Username atau password salah!', 'error');
        }
      };

      loginBtn.addEventListener('click', handleLogin);
      passwordInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleLogin();
      });
    }

    function attachNavigationListeners() {
      const navBtns = document.querySelectorAll('.nav-btn');
      navBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          currentPage = btn.dataset.page;
          renderContent();
        });
      });

      const logoutBtn = document.getElementById('logout-btn');
      logoutBtn.addEventListener('click', () => {
        currentUser = null;
        currentPage = 'login';
        render();
        showToast('Anda telah keluar', 'info');
      });
    }

    function attachScanListeners() {
      const rfidAutoInput = document.getElementById('rfid-auto-input');
      const modeCepatBtn = document.getElementById('mode-cepat');
      const modeJam1Btn = document.getElementById('mode-jam1');
      const modeJam2Btn = document.getElementById('mode-jam2');
      const modeJam3Btn = document.getElementById('mode-jam3');
      const scanModeDisplay = document.getElementById('scan-mode');
      const modeInfoDisplay = document.getElementById('mode-info');
      
      let currentScanMode = 'cepat';
      let scanInProgress = false;

      function updateModeDisplay() {
        const modeBtns = document.querySelectorAll('.mode-btn');
        modeBtns.forEach(btn => {
          btn.classList.remove('ring-4', 'ring-white', 'shadow-lg', 'scale-105');
        });

        let modeText = '';
        let infoText = '';
        let activeBtn = null;

        switch(currentScanMode) {
          case 'cepat':
            modeText = 'Scan Cepat';
            infoText = 'Scan Cepat - Otomatis deteksi jam periode';
            activeBtn = modeCepatBtn;
            break;
          case 'jam1':
            modeText = 'Jam 1';
            infoText = 'Jam 1 (07:00 - 09:00)';
            activeBtn = modeJam1Btn;
            break;
          case 'jam2':
            modeText = 'Jam 2';
            infoText = 'Jam 2 (09:00 - 11:00)';
            activeBtn = modeJam2Btn;
            break;
          case 'jam3':
            modeText = 'Jam 3';
            infoText = 'Jam 3 (11:00 - 13:00)';
            activeBtn = modeJam3Btn;
            break;
        }

        if (activeBtn) {
          activeBtn.classList.add('ring-4', 'ring-white', 'shadow-lg', 'scale-105');
        }

        scanModeDisplay.textContent = modeText;
        modeInfoDisplay.textContent = infoText;
      }

      modeCepatBtn.addEventListener('click', () => {
        currentScanMode = 'cepat';
        updateModeDisplay();
        rfidAutoInput.focus();
        showToast('Mode Scan Cepat aktif - otomatis deteksi jam', 'info');
      });

      modeJam1Btn.addEventListener('click', () => {
        currentScanMode = 'jam1';
        updateModeDisplay();
        rfidAutoInput.focus();
        showToast('Mode Jam 1 aktif', 'info');
      });

      modeJam2Btn.addEventListener('click', () => {
        currentScanMode = 'jam2';
        updateModeDisplay();
        rfidAutoInput.focus();
        showToast('Mode Jam 2 aktif', 'info');
      });

      modeJam3Btn.addEventListener('click', () => {
        currentScanMode = 'jam3';
        updateModeDisplay();
        rfidAutoInput.focus();
        showToast('Mode Jam 3 aktif', 'info');
      });

      updateModeDisplay();

      const handleAutoScan = async () => {
        if (scanInProgress) return;
        
        const rfidValue = rfidAutoInput.value.trim();
        
        if (!rfidValue) {
          return;
        }

        const student = STUDENTS_DATA.find(s => s.rfid === rfidValue);
        
        if (!student) {
          showToast('RFID tidak terdaftar!', 'error');
          rfidAutoInput.value = '';
          rfidAutoInput.focus();
          return;
        }

        scanInProgress = true;
        rfidAutoInput.disabled = true;

        const jamPeriode = currentScanMode === 'cepat' ? getJamPeriode() : currentScanMode;
        const today = getCurrentDate();
        const currentTimeStr = getCurrentTime();
        const existingRecord = allRecords.find(r => 
          r.rfid === rfidValue && r.tanggal === today && r.type === 'attendance'
        );

        if (existingRecord) {
          if (existingRecord[jamPeriode] && existingRecord[jamPeriode] !== '') {
            showToast(`❌ ${student.nama} sudah scan ${jamPeriode.toUpperCase().replace('JAM', 'Jam ')} pada ${existingRecord[jamPeriode]}`, 'error');
            rfidAutoInput.value = '';
            scanInProgress = false;
            rfidAutoInput.disabled = false;
            rfidAutoInput.focus();
            return;
          }
          
          existingRecord[jamPeriode] = currentTimeStr;
          existingRecord.waktu_scan = currentTimeStr;
          existingRecord.status = 'Hadir';
          
          const updateResult = await window.dataSdk.update(existingRecord);
          
          if (updateResult.isOk) {
            showToast(`✅ ${student.nama} - ${jamPeriode.toUpperCase().replace('JAM', 'Jam ')} berhasil dicatat (${currentTimeStr})`, 'success');
            rfidAutoInput.value = '';
            updateRecentScans();
          } else {
            showToast('Gagal memperbarui absensi', 'error');
          }
        } else {
          const newRecord = {
            id: Date.now().toString(),
            rfid: rfidValue,
            nama: student.nama,
            kelas: student.kelas,
            jam1: jamPeriode === 'jam1' ? currentTimeStr : '',
            jam2: jamPeriode === 'jam2' ? currentTimeStr : '',
            jam3: jamPeriode === 'jam3' ? currentTimeStr : '',
            tanggal: today,
            waktu_scan: currentTimeStr,
            status: 'Hadir',
            type: 'attendance'
          };

          const createResult = await window.dataSdk.create(newRecord);
          
          if (createResult.isOk) {
            showToast(`✅ ${student.nama} - ${jamPeriode.toUpperCase().replace('JAM', 'Jam ')} berhasil dicatat (${currentTimeStr})`, 'success');
            rfidAutoInput.value = '';
            updateRecentScans();
          } else {
            showToast('Gagal menyimpan absensi', 'error');
          }
        }

        scanInProgress = false;
        rfidAutoInput.disabled = false;
        rfidAutoInput.focus();
      };

      rfidAutoInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          handleAutoScan();
        }
      });
    }

    function startClock() {
      function updateClock() {
        const now = new Date();
        const timeString = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        const dateString = now.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        
        const clockEl = document.getElementById('clock');
        const dateEl = document.getElementById('date');
        
        if (clockEl) clockEl.textContent = timeString;
        if (dateEl) dateEl.textContent = dateString;
      }

      updateClock();
      setInterval(updateClock, 1000);
    }

    function updateRecentScans() {
      const today = getCurrentDate();
      const todayScans = allRecords
        .filter(r => r.tanggal === today && r.type === 'attendance')
        .sort((a, b) => {
          const timeA = a.waktu_scan || '00:00:00';
          const timeB = b.waktu_scan || '00:00:00';
          return timeB.localeCompare(timeA);
        })
        .slice(0, 5);

      const recentScansList = document.getElementById('recent-scans-list');
      
      if (!recentScansList) return;

      if (todayScans.length === 0) {
        recentScansList.innerHTML = '<p class="text-gray-500 text-center">Belum ada scan hari ini</p>';
        return;
      }

      recentScansList.innerHTML = todayScans.map(scan => `
        <div class="bg-gray-50 rounded-lg p-3 flex justify-between items-center">
          <div>
            <p class="font-semibold text-gray-800">${scan.nama}</p>
            <p class="text-sm text-gray-600">Kelas ${scan.kelas} - ${scan.rfid}</p>
          </div>
          <div class="text-right">
            <p class="text-sm font-semibold text-indigo-600">${scan.waktu_scan}</p>
            <p class="text-xs text-gray-500">
              ${scan.jam1 ? 'Jam 1 ' : ''}${scan.jam2 ? 'Jam 2 ' : ''}${scan.jam3 ? 'Jam 3' : ''}
            </p>
          </div>
        </div>
      `).join('');
    }

        try {

      const cancelManualBtn = document.getElementById('cancel-manual-btn');

      const saveManualBtn = document.getElementById('save-manual-btn');
      saveManualBtn.addEventListener('click', async () => {
        const studentRfid = document.getElementById('manual-student').value;

        if (!studentRfid) {

        );

            document.getElementById('manual-modal').classList.add('hidden');
            renderContent();
          } else {

        } else {

          };

          const createResult = await window.dataSdk.create(newRecord);
          
          if (createResult.isOk) {
            showToast(`✅ Absensi ${student.nama} - ${jamPeriode.toUpperCase().replace('JAM', 'Jam ')} (${status}) berhasil disimpan`, 'success');
            document.getElementById('manual-modal').classList.add('hidden');

          } else {
            showToast('Gagal menyimpan absensi', 'error');
          }
        }

        saveManualBtn.disabled = false;
      });

      const deleteRecordBtns = document.querySelectorAll('.delete-record-btn');
      deleteRecordBtns.forEach(btn => {
        btn.addEventListener('click', async () => {
          const recordId = btn.dataset.id;
          const record = allRecords.find(r => r.id === recordId);
          
          if (!record) return;

          btn.disabled = true;

          const deleteResult = await window.dataSdk.delete(record);
          
          if (deleteResult.isOk) {
            showToast('Data absensi berhasil dihapus', 'success');
            renderContent();
          } else {
            showToast('Gagal menghapus data absensi', 'error');
          }

      exportBtn.addEventListener('click', () => {
        const filteredRecords = allRecords
          .filter(r => r.type === 'attendance')

        filteredRecords.forEach((record, index) => {

    function attachRekapListeners() {
      const rekapBulanInput = document.getElementById('rekap-bulan');
      const syncRekapBtn = document.getElementById('sync-rekap-btn');
      
      rekapBulanInput.addEventListener('change', () => {
        renderContent();
      });

      syncRekapBtn.addEventListener('click', async () => {
        const selectedMonth = rekapBulanInput.value;
        const monthRecords = allRecords.filter(r => r.tanggal.startsWith(selectedMonth) && r.type === 'attendance');

        const studentStats = STUDENTS_DATA.map(student => {
          const records = monthRecords.filter(r => r.rfid === student.rfid);
          
          let jam1Hadir = 0, jam1Sakit = 0, jam1Izin = 0;
          let jam2Hadir = 0, jam2Sakit = 0, jam2Izin = 0;
          let jam3Hadir = 0, jam3Sakit = 0, jam3Izin = 0;
          
          records.forEach(r => {
            if (r.jam1) {
              if (r.jam1 === 'Hadir' || (r.jam1 !== 'Sakit' && r.jam1 !== 'Izin')) {
                jam1Hadir++;
              } else if (r.jam1 === 'Sakit') {
                jam1Sakit++;
              } else if (r.jam1 === 'Izin') {
                jam1Izin++;
              }
            }
            
            if (r.jam2) {
              if (r.jam2 === 'Hadir' || (r.jam2 !== 'Sakit' && r.jam2 !== 'Izin')) {
                jam2Hadir++;
              } else if (r.jam2 === 'Sakit') {
                jam2Sakit++;
              } else if (r.jam2 === 'Izin') {
                jam2Izin++;
              }
            }
            
            if (r.jam3) {
              if (r.jam3 === 'Hadir' || (r.jam3 !== 'Sakit' && r.jam3 !== 'Izin')) {
                jam3Hadir++;
              } else if (r.jam3 === 'Sakit') {
                jam3Sakit++;
              } else if (r.jam3 === 'Izin') {
                jam3Izin++;
              }
            }
          });

          const totalHadir = jam1Hadir + jam2Hadir + jam3Hadir;
          const totalSakit = jam1Sakit + jam2Sakit + jam3Sakit;
          const totalIzin = jam1Izin + jam2Izin + jam3Izin;

          return { 
            ...student, 
            jam1: { hadir: jam1Hadir, sakit: jam1Sakit, izin: jam1Izin },
            jam2: { hadir: jam2Hadir, sakit: jam2Sakit, izin: jam2Izin },
            jam3: { hadir: jam3Hadir, sakit: jam3Sakit, izin: jam3Izin },
            total: { hadir: totalHadir, sakit: totalSakit, izin: totalIzin }
          };
        });

        if (studentStats.length === 0) {
          showToast('Tidak ada data rekap untuk dikirim', 'error');
          return;
        }

        syncRekapBtn.disabled = true;
        const syncText = document.getElementById('sync-rekap-text');
        const originalText = syncText.textContent;

          syncRekapBtn.disabled = false;
        }
      });
    }

        if (!initResult.isOk) {
          showToast('Gagal menginisialisasi database', 'error');
        }
      }

      render();
    });
